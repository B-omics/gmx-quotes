[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmx-quotes"
version = "0.1.0"
description = "Customize the quotations displayed in your GROMACS workflow without modifying GROMACS itself."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vasilis Xenidis", email = "xenidisv@uni-mainz.de" }]
keywords = ["gromacs", "molecular-dynamics", "quotes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.scripts]
gmx-quotes = "gmx_quotes.cli:main"

[tool.hatch.build.targets.wheel]
include = ["gmx_quotes", "quotes"]
